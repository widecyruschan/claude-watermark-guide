<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Completing sign-in | Watermark Lens</title>
  <meta name="description" content="Complete a secure Watermark Lens account sign-in." />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="canonical" href="https://watermarklens.com/auth/callback" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&family=Source+Serif+4:opsz@8..60&display=swap" rel="stylesheet" />
  <script defer src="/js/auth.js"></script>
</head>
<body data-auth-page="callback">
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/">Watermark Lens</a>
      <nav class="nav" aria-label="Primary navigation">
        <a href="/">Home</a>
        <a href="/what-is-claude-watermark">What Is</a>
        <a href="/how-it-works">How It Works</a>
        <a href="/changes-2026">What Changed</a>
        <a href="/checker">Free Checker</a>
        <a href="/rewrite">AI Rewriter</a>
        <a href="/login">Sign in</a>
      </nav>
    </div>
  </header>

  <main class="auth-shell">
    <section class="auth-panel" aria-labelledby="callbackTitle">
      <p class="auth-kicker">Secure sign-in</p>
      <h1 id="callbackTitle">Completing sign-in</h1>
      <p id="authStatus" class="auth-status" role="status" aria-live="assertive">Checking your sign-in…</p>
      <p id="authRecovery" class="auth-recovery" hidden><a class="btn" href="/login">Return to sign in</a></p>
    </section>
  </main>
</body>
</html>
