name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build flattened deploy dir
        run: |
          mkdir -p dist
          # copy root-level files/dirs (css, js, assets, images, robots, sitemap, index, 404, etc.)
          for item in $(ls -A | grep -vE '^(pages|dist|\.git|\.github|\.wrangler|README\.md|\.gitignore)$'); do
            cp -r "$item" dist/
          done
          # flatten pages/*.html -> dist/<name>.html so /page resolves via native clean-URL
          cp pages/*.html dist/
          echo "--- dist contents ---"
          ls -1 dist

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest pages deploy dist \
            --project-name claude-watermark-guide \
            --commit-dirty=true
