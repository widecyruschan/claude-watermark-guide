<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Account | Watermark Lens</title>
    <meta
      name="description"
      content="View your Watermark Lens account, membership plan, and AI rewriting usage."
    />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="canonical" href="https://watermarklens.com/account" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&family=Source+Serif+4:opsz@8..60&display=swap"
      rel="stylesheet"
    />
    <script defer src="/js/auth.js"></script>
  </head>
  <body data-auth-page="account">
    <header class="site-header">
      <div class="container">
        <a class="brand" href="/">Watermark Lens</a>
        <nav class="nav">
          <a href="/">Home</a>
          <a href="/checker">Free Checker</a>
        </nav>
      </div>
    </header>

    <main class="auth-shell auth-shell-wide">
      <section class="auth-panel" aria-labelledby="accountTitle">
        <p class="auth-kicker">Member account</p>
        <h1 id="accountTitle">Your account</h1>
        <p id="authStatus" class="auth-status" role="status" aria-live="polite">Loading account…</p>

        <dl id="accountDetails" class="account-details" hidden>
          <div>
            <dt>Email</dt>
            <dd id="accountEmail">—</dd>
          </div>
          <div>
            <dt>Display name</dt>
            <dd id="accountDisplayName">—</dd>
          </div>
          <div>
            <dt>Plan</dt>
            <dd id="accountPlan">—</dd>
          </div>
          <div>
            <dt>Billing status</dt>
            <dd id="accountBillingStatus">—</dd>
          </div>
          <div>
            <dt>Current period</dt>
            <dd id="accountPeriod">—</dd>
          </div>
          <div>
            <dt>Current usage</dt>
            <dd id="accountUsage">—</dd>
          </div>
        </dl>

        <div class="auth-actions">
          <a class="btn" href="/checker">Open Free Checker</a>
          <button id="signOutButton" class="btn btn-secondary" type="button" disabled>
            Sign out
          </button>
        </div>
      </section>
    </main>

    <footer>
      <div class="container">
        <a href="/privacy">Privacy</a>
        <a href="/terms">Terms</a>
        <a href="/cookie">Cookie</a>
      </div>
    </footer>
  </body>
</html>
